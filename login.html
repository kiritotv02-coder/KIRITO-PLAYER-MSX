
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KIRITO PLAYER</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;padding:20px;
  background:#030712;color:white;font-family:Arial;
  display:flex;align-items:center;justify-content:center
}
.login{
  width:100%;max-width:380px;padding:28px;
  background:#0b1425;border:1px solid #087dff;
  border-radius:16px;box-shadow:0 0 25px #0066ff55
}
h1{text-align:center;color:#16aaff;letter-spacing:2px}
p{text-align:center;color:#9bbbd8}
input,button{
  width:100%;padding:14px;margin:9px 0;
  border-radius:8px;font-size:15px
}
input{
  border:1px solid #1768a8;background:#050b16;color:white
}
button{
  border:0;background:#087dff;color:white;
  font-weight:bold;cursor:pointer
}
.settings{background:#172b45}
#mensagem{font-size:13px;min-height:35px}
</style>
</head>
<body>
<div class="login">
  <h1>KIRITO PLAYER</h1>
  <p>XTREAM CODES COMPATIBLE API</p>

  <input id="dns" placeholder="Servidor DNS (http://...)">
  <input id="usuario" placeholder="Nome de usuário">
  <input id="senha" type="password" placeholder="Senha">

  <button onclick="entrar()">ENTRAR</button>
  <button class="settings" onclick="limparDados()">
    SETTINGS / TROCAR SERVIDOR
  </button>
  <p id="mensagem"></p>
</div>

<script>
const WORKER =
"https://kirito-player-proxy.leomaxbolado.workers.dev";

window.onload = function(){
  dns.value = localStorage.getItem("kirito_dns") || "";
  usuario.value = localStorage.getItem("kirito_usuario") || "";
  senha.value = localStorage.getItem("kirito_senha") || "";
};

async function entrar(){
  const servidor = dns.value.trim().replace(/\/+$/, "");
  const user = usuario.value.trim();
  const pass = senha.value;
  const msg = document.getElementById("mensagem");

  if(!servidor || !user || !pass){
    msg.textContent = "Preencha todos os campos.";
    return;
  }

  let endereco;
  try{
    endereco = new URL(servidor);
    if(!["http:","https:"].includes(endereco.protocol) ||
       endereco.port || endereco.pathname !== "/" ||
       endereco.search || endereco.hash){
      throw new Error();
    }
  }catch(e){
    msg.textContent = "Confira o DNS. Use o endereço sem porta.";
    return;
  }

  msg.textContent = "Conectando ao servidor...";

  try{
    const resposta = await fetch(WORKER,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        dns:servidor,
        username:user,
        password:pass,
        action:"login"
      })
    });

    const dados = await resposta.json();

    if(!resposta.ok){
      msg.textContent = dados.error || "Erro na conexão.";
      return;
    }

    if(dados.user_info && Number(dados.user_info.auth) === 1){
      localStorage.setItem("kirito_dns",servidor);
      localStorage.setItem("kirito_usuario",user);
      localStorage.setItem("kirito_senha",pass);
      msg.textContent = "LOGIN VALIDADO! Conexão funcionando.";
    }else if(dados.user_info){
      msg.textContent = "Usuário ou senha não autorizados.";
    }else{
      msg.textContent = "Servidor respondeu, mas o login não foi confirmado.";
    }

  }catch(e){
    msg.textContent = "Falha ao conectar. Verifique a internet e o Worker.";
  }
}

function limparDados(){
  localStorage.removeItem("kirito_dns");
  localStorage.removeItem("kirito_usuario");
  localStorage.removeItem("kirito_senha");
  dns.value="";
  usuario.value="";
  senha.value="";
  document.getElementById("mensagem").textContent =
    "Dados apagados. Informe outro servidor.";
}
</script>
</body>
</html>
